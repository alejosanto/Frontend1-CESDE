<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller 3 - Ciclos</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 850px; margin: 40px auto; padding: 0 20px; }
        a { display: inline-block; margin: 6px; padding: 10px 14px; border: 1px solid #333; text-decoration: none; color: #111; border-radius: 6px; }
        a:hover { background: #eee; }
        .bloque { margin-top: 22px; padding: 16px; border: 1px solid #999; border-radius: 6px; }
        #resultado { white-space: pre-line; }
    </style>
</head>
<body>
    <h1>Taller 3 - Ciclos</h1>
    <p>Seleccione un ejercicio para ejecutarlo.</p>

    <div>
        <a href="?ejercicio=1">Ejercicio 1</a>
        <a href="?ejercicio=2">Ejercicio 2</a>
        <a href="?ejercicio=3">Ejercicio 3</a>
        <a href="?ejercicio=4">Ejercicio 4</a>
        <a href="?ejercicio=5">Ejercicio 5</a>
        <a href="?ejercicio=6">Ejercicio 6</a>
        <a href="?ejercicio=7">Ejercicio 7</a>
        <a href="?ejercicio=8">Ejercicio 8</a>
        <a href="?ejercicio=9">Ejercicio 9</a>
    </div>

    <div class="bloque">
        <h2>¿Qué pide el ejercicio?</h2>
        <p id="enunciado">Seleccione un ejercicio para ver el enunciado.</p>
        <p id="datos"></p>
    </div>

    <div class="bloque">
        <h2>Resultado</h2>
        <div id="resultado">Seleccione un ejercicio para comenzar.</div>
    </div>

    <script>
        const ejercicios = {
            1: { enunciado: "Calcular la suma de los N números naturales, donde N es el número límite ingresado.", datos: "Dato solicitado: número límite N." },
            2: { enunciado: "Pedir el nombre de un estudiante y N notas, calcular el promedio y determinar si aprueba o reprueba. Aprueba con promedio de 3.", datos: "Datos solicitados: nombre, cantidad de notas y cada nota." },
            3: { enunciado: "Ingresar varios números enteros, mostrar cuántos se ingresaron y la suma de todos. Repetir hasta escribir FIN.", datos: "Datos solicitados: números enteros hasta ingresar FIN." },
            4: { enunciado: "Realizar la tabla de multiplicar de cualquier número ingresado hasta el 30.", datos: "Dato solicitado: número de la tabla." },
            5: { enunciado: "Crear la tabla de multiplicar de cualquier número ingresado de manera descendente.", datos: "Dato solicitado: número de la tabla." },
            6: { enunciado: "Crear un ciclo que cuente del 1 al 30 en intervalos del número ingresado.", datos: "Dato solicitado: tamaño del intervalo." },
            7: { enunciado: "Crear un ciclo que cuente del 1 al 30 en intervalos del número ingresado, de manera regresiva.", datos: "Dato solicitado: tamaño del intervalo." },
            8: { enunciado: "Pedir la edad a 10 estudiantes y determinar cuántos son menores de edad y cuántos son mayores de edad.", datos: "Datos solicitados: edad de 10 estudiantes." },
            9: { enunciado: "Generar un número aleatorio y compararlo con el número que digite el usuario. Tiene 3 intentos para acertar.", datos: "Datos solicitados: número del usuario en cada intento." }
        };

        const resultado = document.getElementById("resultado");
        const promptOriginal = window.prompt;
        const alertOriginal = window.alert;
        const writeOriginal = document.write.bind(document);
        const logOriginal = console.log.bind(console);

        window.prompt = function(mensaje) {
            const respuesta = promptOriginal(mensaje);
            resultado.innerHTML += "Dato ingresado - " + mensaje + ": " + respuesta + "<br>";
            return respuesta;
        };

        window.alert = function(mensaje) {
            resultado.innerHTML += "Resultado: " + mensaje + "<br>";
            alertOriginal(mensaje);
        };

        console.log = function(...datos) {
            resultado.innerHTML += datos.join(" ") + "<br>";
            logOriginal(...datos);
        };

        document.write = function(texto) {
            resultado.innerHTML += texto;
        };

        const parametros = new URLSearchParams(window.location.search);
        const ejercicio = parametros.get("ejercicio");

        if (ejercicios[ejercicio]) {
            document.getElementById("enunciado").textContent = ejercicios[ejercicio].enunciado;
            document.getElementById("datos").textContent = ejercicios[ejercicio].datos;
            resultado.innerHTML = "";
            const script = document.createElement("script");
            script.src = "ejercicio" + ejercicio + ".js";
            document.body.appendChild(script);
        }
    </script>
</body>
</html>
